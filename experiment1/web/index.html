<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BP 手写数字识别</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="workspace">
        <div class="draw-panel">
          <div class="panel-head">
            <div>
              <p class="eyebrow">Back Propagation MNIST Lab</p>
              <h1>BP 手写数字识别</h1>
            </div>
            <span id="modelStatus" class="status">连接中</span>
          </div>

          <div class="model-bar">
            <label class="model-select">
              <span>模型权重</span>
              <select id="modelSelect"></select>
            </label>
            <small id="modelNote">正在检测可用模型</small>
          </div>

          <div class="canvas-wrap">
            <canvas id="digitCanvas" width="560" height="560" aria-label="手写数字画板"></canvas>
          </div>

          <div class="toolbar">
            <label class="control">
              <span>笔粗</span>
              <input id="brushSize" type="range" min="20" max="68" value="44" />
            </label>
            <button id="clearBtn" type="button">清空</button>
            <button id="predictBtn" type="button" class="primary">识别</button>
          </div>
        </div>

        <aside class="result-panel">
          <div class="prediction">
            <span class="label">预测结果</span>
            <strong id="prediction">-</strong>
            <small id="confidence">等待输入</small>
          </div>

          <div class="bars" id="bars"></div>

          <div class="mini-grid">
            <div>
              <span>预处理</span>
              <canvas id="previewCanvas" width="112" height="112"></canvas>
            </div>
            <div id="top3Box">
              <span>Top 3 排名</span>
              <ol id="topList"></ol>
              <small class="chart-hint">点击查看扇形图</small>
            </div>
          </div>

          <section class="gan-widget" aria-label="ACGAN 生成窗口">
            <div class="gan-head">
              <div>
                <span>ACGAN</span>
                <strong>生成样本</strong>
              </div>
              <span id="ganStatus" class="pill">检测中</span>
            </div>
            <div class="gan-controls">
              <select id="ganDigit" aria-label="选择生成数字">
                <option value="0">0</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
              </select>
              <button id="ganGenerateBtn" type="button">生成</button>
            </div>
            <div class="gan-preview">
              <img id="ganImage" alt="ACGAN 生成的 MNIST 样本" />
              <small id="ganMessage">等待生成器</small>
            </div>
          </section>
        </aside>
      </section>

      <section class="notes">
        <article>
          <h2>模型对比</h2>
          <p>前端可以切换 BP、增强版BP、强化学习增强版BP、ACGAN增强版BP 和 CNN/Residual BP 权重，比较不同反向传播模型的识别结果。</p>
        </article>
        <article>
          <h2>创新设计</h2>
          <p>强化学习负责选择训练增强策略，ACGAN 负责生成带标签样本，主分类器仍围绕 BP 训练展开。</p>
        </article>
      </section>
    </main>

    <div id="donutModal" class="modal-overlay" aria-hidden="true">
      <div class="modal-panel">
        <button class="modal-close" aria-label="关闭">&times;</button>
        <h3>概率扇形图</h3>
        <div id="modalDonut"></div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
